<body id="top">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div id="site-header"></div>

  <!-- Entradas que publican los departamentos y secciones desde el panel.
       La dirección es /blog/entrada?e=<slug>; el contenido lo pinta
       assets/js/entrada.js con lo que devuelve la base de datos. -->
  <main id="contenido" class="post-card" data-entrada aria-busy="true">
  <a href="/blog" class="post-card__cerrar" data-cerrar-post aria-label="Cerrar y volver al blog"><i class="bi bi-x-lg" aria-hidden="true"></i></a>

  <section class="page-hero entrada-hero" data-entrada-hero>
    <div class="container page-hero__inner">
      <div>
        <nav class="crumbs" aria-label="Migas de pan">
          <a href="/">Inicio</a> <i class="bi bi-chevron-right" aria-hidden="true"></i>
          <a href="/blog">Blog</a> <i class="bi bi-chevron-right" aria-hidden="true"></i>
          <span data-entrada-miga>Entrada</span>
        </nav>
        <h1 data-entrada-titulo>Cargando la entrada…</h1>
        <p data-entrada-resumen></p>
      </div>
      <div class="page-hero__meta" data-entrada-meta></div>
    </div>
  </section>

  <section class="container article">
    <article class="prose" data-entrada-cuerpo>
      <noscript><p>Para leer esta entrada hace falta JavaScript. Puedes ver el resto de noticias en el <a href="/blog">blog</a>.</p></noscript>
    </article>
    <aside class="aside" data-entrada-lateral hidden></aside>
  </section>
  </main>
