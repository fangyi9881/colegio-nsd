# Copia de seguridad de Supabase (el plan gratuito no las guarda descargables).
#
# Cada domingo de madrugada vuelca la base de datos entera (usuarios,
# permisos, contenidos, blog, fichas, historial y canal interno), la CIFRA
# y la guarda 90 días como «artifact» de esta acción. Sin cifrar no sale
# de la máquina de GitHub: el canal interno tiene datos personales.
#
# Necesita dos secretos en GitHub → Settings → Secrets and variables →
# Actions (ver docs/COPIAS.md):
#   SUPABASE_DB_URL  cadena de conexión «Session pooler» de Supabase
#   COPIA_CLAVE      contraseña para cifrar y descifrar las copias
name: Copia de seguridad de Supabase

on:
  schedule:
    - cron: '17 3 * * 0'   # domingos, 03:17 UTC
  workflow_dispatch: {}     # y a mano: Actions → este flujo → Run workflow

permissions:
  contents: read

concurrency:
  group: copia-supabase
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar secretos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$COPIA_CLAVE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL o COPIA_CLAVE (docs/COPIAS.md)."
            exit 1
          fi
          if [ "${#COPIA_CLAVE}" -lt 16 ]; then
            echo "::error::COPIA_CLAVE tiene que tener al menos 16 caracteres."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Volcar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p copia
          supabase db dump --db-url "$SUPABASE_DB_URL" -f copia/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f copia/esquema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f copia/datos.sql --use-copy --data-only
          # Comprobación mínima: que haya datos de verdad
          for t in public.contenidos public.perfiles public.entradas; do
            grep -q "COPY \"${t#public.}\"\|COPY $t\|COPY \"public\".\"${t#public.}\"" copia/datos.sql \
              || { echo "::error::La copia no contiene $t"; exit 1; }
          done
          ls -la copia

      - name: Cifrar
        env:
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
        run: |
          set -euo pipefail
          nombre="supabase-colegio-$(date -u +%Y-%m-%d)"
          tar -czf "$nombre.tar.gz" -C copia .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 -o "$nombre.tar.gz.gpg" "$nombre.tar.gz" <<< "$COPIA_CLAVE"
          shred -u "$nombre.tar.gz" copia/*.sql
          echo "NOMBRE=$nombre" >> "$GITHUB_ENV"
          ls -la "$nombre.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}
          path: ${{ env.NOMBRE }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
